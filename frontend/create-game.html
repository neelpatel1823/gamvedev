<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Game | Team &amp; Game Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">Team &amp; Game Manager</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="teams.html" class="nav-link">Teams</a>
        <a href="create-team.html" class="nav-link">Create Team</a>
        <a href="edit-team.html" class="nav-link">Edit Team</a>
        <a href="games.html" class="nav-link">Games</a>
        <a href="create-game.html" class="nav-link active">Create Game</a>
        <a href="edit-game.html" class="nav-link">Edit Game</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="page-header">
      <div>
        <h1>Create Game</h1>
        <p>Add a new game to the catalog with its name, price, genre, platform, and description.</p>
      </div>
      <a href="games.html" class="btn btn-secondary">Back to Games</a>
    </section>

    <section class="section">
      <div class="form-box">
        <form id="create-game-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="game-name">Game Name</label>
              <input type="text" id="game-name" placeholder="Enter game name" required />
            </div>

            <div class="form-group">
              <label for="game-price">Game Price (₹)</label>
              <input type="number" id="game-price" step="0.01" placeholder="Enter price" required />
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="game-genre">Genre</label>
              <input type="text" id="game-genre" placeholder="e.g., Action, Sports, RPG" />
            </div>

            <div class="form-group">
              <label for="game-platform">Platform</label>
              <input type="text" id="game-platform" placeholder="e.g., PC, Console, Mobile" />
            </div>
          </div>

          <div class="form-group">
            <label for="game-description">Game Description</label>
            <textarea id="game-description" placeholder="Write a short description about the game" required></textarea>
          </div>

          <button type="submit" class="btn btn-teal">Create Game</button>
          <a href="games.html" class="btn btn-secondary">Cancel</a>
          <div id="status" class="status-msg"></div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('create-game-form');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Saving...';

      const payload = {
        name: document.getElementById('game-name').value.trim(),
        description: document.getElementById('game-description').value.trim(),
        price: document.getElementById('game-price').value,
        genre: document.getElementById('game-genre').value.trim() || 'General',
        platform: document.getElementById('game-platform').value.trim() || 'PC',
      };

      try {
        await GamesAPI.create(payload);
        window.location.href = 'games.html';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
